<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Nightfall Diner V2.1</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080b12;
    font-family:Arial,sans-serif;
    color:white;
    touch-action:none;
}

canvas{
    display:block;
}

#startScreen{
    position:fixed;
    inset:0;
    z-index:30;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:radial-gradient(circle,#1b2b40,#030507 75%);
}

#startBox{
    width:90%;
    max-width:600px;
}

#startBox h1{
    font-size:42px;
    letter-spacing:5px;
}

button{
    border:0;
    border-radius:10px;
    padding:15px 25px;
    font-size:16px;
    font-weight:bold;
}

#startButton{
    margin-top:20px;
}

#hud{
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:5px;
    height:5px;
    margin:-2.5px;
    background:white;
    border-radius:50%;
}

#batteryBox{
    position:absolute;
    right:18px;
    top:18px;

    background:rgba(0,0,0,.55);

}

#batteryBar{
    height:8px;
    margin-top:6px;
    background:#333;
    border-radius:5px;
    overflow:hidden;
}

#batteryFill{
    height:100%;
    width:100%;
    background:#dcecff;
}

#inventory{
    position:absolute;
    left:18px;
    top:18px;
    padding:10px 13px;
    background:rgba(0,0,0,.55);
    border-radius:8px;
}

#objective{
    position:absolute;
    left:18px;
    bottom:18px;

    padding:12px;
    background:rgba(0,0,0,.55);
    border-radius:8px;
}

#prompt{
    position:absolute;
    left:50%;
    bottom:18%;
    transform:translateX(-50%);
    padding:10px 16px;
    background:rgba(0,0,0,.75);
    border-radius:8px;
    display:none;
}

#mobileControls{
    display:none;
    position:fixed;
    inset:0;
    z-index:15;
    pointer-events:none;
}

.mobileButton{
    position:absolute;
    pointer-events:auto;
    width:70px;
    height:70px;
    border-radius:50%;
    background:rgba(255,255,255,.18);
    color:white;
    border:1px solid rgba(255,255,255,.3);
    backdrop-filter:blur(4px);
}

#joystick{
    left:30px;
    bottom:30px;
    width:150px;
    height:150px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
    pointer-events:auto;
}

#stick{
    position:absolute;
    left:50%;
    top:50%;
    width:65px;
    height:65px;
    margin:-32.5px;
    border-radius:50%;
    background:rgba(255,255,255,.25);
}

#lookArea{
    position:absolute;
    right:0;
    top:0;
    width:65%;
    height:100%;
    pointer-events:auto;
}

#flashButton{
    right:25px;
    bottom:115px;
}

#interactButton{
    right:25px;
    bottom:30px;
}

@media (pointer:coarse){
    #mobileControls{
        display:block;
    }

    #crosshair{
        opacity:.5;
    }
}

.small{
    opacity:.7;
    line-height:1.6;
    font-size:13px;
}
</style>
</head>

<body>

<div id="startScreen">
    <div id="startBox">
        <h1>NIGHTFALL DINER</h1>

        <p>
            Something is watching from the forest.
        </p>

        <p class="small">
            Explore the forest.<br>
            Find batteries and investigate the diner.
        </p>

        <button id="startButton">
            ENTER THE FOREST
        </button>
    </div>
</div>


<div id="hud">

    <div id="inventory">
        Items: <span id="items">0</span>
    </div>

    <div id="batteryBox">
        Flashlight:
        <span id="batteryText">100%</span>

        <div id="batteryBar">
            <div id="batteryFill"></div>
        </div>
    </div>

    <div id="crosshair"></div>

    <div id="prompt"></div>

    <div id="objective">
        Objective: Explore the forest and investigate the diner.
    </div>

</div>


<div id="mobileControls">

    <div id="lookArea"></div>

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <button
        id="flashButton"
        class="mobileButton">
        🔦
    </button>

    <button
        id="interactButton"
        class="mobileButton">
        E
    </button>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js";


/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x111a29);

scene.fog =
    new THREE.FogExp2(
        0x111a29,
        0.017
    );


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        72,
        innerWidth / innerHeight,
        .05,
        500
    );

camera.position.set(
    0,
    1.7,
    30
);


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled =
    true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   GAME VARIABLES
========================================================= */

let gameStarted = false;

let flashlightOn = true;

let battery = 100;

let collectedItems = 0;

let interactables = [];

let yaw = 0;

let pitch = 0;

let moveX = 0;

let moveY = 0;


/* =========================================================
   HELPERS
========================================================= */

function material(
    color,
    roughness = 1
){

    return new THREE.MeshStandardMaterial({
        color:color,
        roughness:roughness
    });

}


function box(
    w,
    h,
    d,
    mat,
    x,
    y,
    z
){

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w,
                h,
                d
            ),
            mat
        );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    scene.add(mesh);

    return mesh;
}


function cylinder(
    r,
    h,
    mat,
    x,
    y,
    z
){

    const mesh =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                r,
                r*.88,
                h,
                10
            ),
            mat
        );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    scene.add(mesh);

    return mesh;
}

   LIGHTING
========================================================= */

);

   FLASHLIGHT
========================================================= */

        .55,

flashlight.castShadow =

scene.add(
    flashlight
);

scene.add(
    flashlight.target
);


function updateFlashlight(){

    const direction =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    direction.applyQuaternion(
        camera.quaternion
    );

    flashlight.position.copy(
        camera.position
    );

    flashlight.target.position.copy(
        camera.position
    );

    flashlight.target.position.add(
        direction.multiplyScalar(20)
    );

    flashlight.visible =
        flashlightOn &&
        battery > 0;
}

function createTree(
    x,
    z,
    scale
){

    cylinder(

        3.4*scale,
        bark,
        x,

        z

                    2.1*scale,
                    8

                leaves
            );

        crown.position.set(
            x+(Math.random()-.5)*.35*scale,
            (2.5+i*.7)*scale,
            z+(Math.random()-.5)*.35*scale
        );

        crown.castShadow =
            true;

        scene.add(crown);

    }

}

){

/* =========================================================
   INTERACTION
========================================================= */

function interact(){

    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        ).applyQuaternion(
            camera.quaternion
        );


    let closest = null;

    let distanceLimit = 3.2;


    for(
        const item of interactables
    ){

        const distance =
            camera.position.distanceTo(
                item.position
            );


        const direction =
            item.position
                .clone()
                .sub(camera.position)
                .normalize();


        if(
            distance < distanceLimit &&
            forward.dot(direction) > .45
        ){

            closest =
                item;

            distanceLimit =
                distance;

        }

    }


    if(!closest){
        return;
    }


    if(
        closest.userData.type ===
        "battery"
    ){

        battery =
            Math.min(
                100,
                battery+35
            );

        setObjective(
            "Battery collected. Flashlight charge restored."
        );

    }


    else if(
        closest.userData.type ===
        "chicken"
    ){

        setObjective(
            "Chicken collected."
        );

    }


    else if(
        closest.userData.type ===
        "speaker"
    ){

        setObjective(
            "Speaker collected. Something is playing..."
        );

    }


    scene.remove(
        closest
    );


    interactables =
        interactables.filter(
            item =>
                item !== closest
        );


    collectedItems++;


    document.getElementById(
        "items"
    ).textContent =
        collectedItems;

}


/* =========================================================
   PROMPT
========================================================= */

function updatePrompt(){

    const prompt =
        document.getElementById(
            "prompt"
        );

    prompt.style.display =
        "none";


    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        ).applyQuaternion(
            camera.quaternion
        );


    for(
        const item of interactables
    ){

        const distance =
            camera.position.distanceTo(
                item.position
            );


        const direction =
            item.position
                .clone()
                .sub(camera.position)
                .normalize();


        if(
            distance < 3.2 &&
            forward.dot(direction) > .45
        ){

            prompt.textContent =
                "[E] PICK UP " +
                item.userData.name
                    .toUpperCase();

            prompt.style.display =
                "block";

            break;

        }

    }

}


/* =========================================================
   TOUCH LOOK
========================================================= */

const lookArea =
    document.getElementById(
        "lookArea"
    );

let looking = false;

let lastTouchX = 0;
let lastTouchY = 0;


lookArea.addEventListener(
    "pointerdown",
    event => {

        looking = true;

        lastTouchX =
            event.clientX;

        lastTouchY =
            event.clientY;

    }
);


lookArea.addEventListener(
    "pointermove",
    event => {

        if(!looking){
            return;
        }


        const dx =
            event.clientX -
            lastTouchX;

        const dy =
            event.clientY -
            lastTouchY;


        lastTouchX =
            event.clientX;

        lastTouchY =
            event.clientY;


        yaw -=
            dx * .004;

        pitch -=
            dy * .003;


        pitch =
            Math.max(
                -1.35,
                Math.min(
                    1.35,
                    pitch
                )
            );

    }
);


lookArea.addEventListener(
    "pointerup",
    () => {

        looking = false;

    }
);

lookArea.addEventListener(
    "pointercancel",
    () => {

        looking = false;

    }
);


/* =========================================================
   JOYSTICK
========================================================= */

const joystick =
    document.getElementById(
        "joystick"
    );

const stick =
    document.getElementById(
        "stick"
    );

let joystickActive =
    false;


joystick.addEventListener(
    "pointerdown",
    event => {

        joystickActive =
            true;

        joystick.setPointerCapture(
            event.pointerId
        );

        updateJoystick(
            event
        );

    }
);


joystick.addEventListener(
    "pointermove",
    event => {

        if(
            joystickActive
        ){

            updateJoystick(
                event
            );

        }

    }
);


joystick.addEventListener(
    "pointerup",
    resetJoystick
);

joystick.addEventListener(
    "pointercancel",
    resetJoystick
);


function updateJoystick(
    event
){

    const rect =
        joystick.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width/2;

    const centerY =
        rect.top +
        rect.height/2;


    let dx =
        event.clientX -
        centerX;

    let dy =
        event.clientY -
        centerY;


    const max =
        55;


    const length =
        Math.sqrt(
            dx*dx +
            dy*dy
        );


    if(
        length > max
    ){

        dx =
            dx/length*max;

        dy =
            dy/length*max;

    }


    stick.style.transform =
        `translate(${dx}px,${dy}px)`;


    moveX =
        dx/max;

    moveY =
        dy/max;

}


function resetJoystick(){

    joystickActive =
        false;

    stick.style.transform =
        "translate(0,0)";

    moveX = 0;
    moveY = 0;

}


/* =========================================================
   MOBILE BUTTONS
========================================================= */

document.getElementById(
    "flashButton"
).addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        flashlightOn =
            !flashlightOn;

    }
);


document.getElementById(
    "interactButton"
).addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        interact();

    }
);


/* =========================================================
   DESKTOP KEYBOARD
========================================================= */

const keys = {};


document.addEventListener(
    "keydown",
    event => {

        keys[event.code] =
            true;


        if(
            event.code === "KeyF"
        ){

            flashlightOn =
                !flashlightOn;

        }


        if(
            event.code === "KeyE"
        ){

            interact();

        }

    }
);


document.addEventListener(
    "keyup",
    event => {

        keys[event.code] =
            false;

    }
);


/* =========================================================
   MOVEMENT
========================================================= */

function movement(
    dt
){

    let forward = 0;

    let right = 0;


    if(keys.KeyW){
        forward += 1;
    }

    if(keys.KeyS){
        forward -= 1;
    }

    if(keys.KeyD){
        right += 1;
    }

    if(keys.KeyA){
        right -= 1;
    }


    forward +=
        -moveY;

    right +=
        moveX;


    const direction =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    direction.applyAxisAngle(
        new THREE.Vector3(0,1,0),
        yaw
    );


    const rightDirection =
        new THREE.Vector3(
            1,
            0,
            0
        );

    rightDirection.applyAxisAngle(
        new THREE.Vector3(0,1,0),
        yaw
    );


    camera.position.add(
        direction.multiplyScalar(
            forward * 6 * dt
        )
    );


    camera.position.add(
        rightDirection.multiplyScalar(
            right * 6 * dt
        )
    );


    camera.position.y =
        1.7;


    camera.position.x =
        Math.max(
            -100,
            Math.min(
                100,
                camera.position.x
            )
        );


    camera.position.z =
        Math.max(
            -100,
            Math.min(
                75,
                camera.position.z
            )
        );

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

    camera.rotation.order =
        "YXZ";

    camera.rotation.y =
        yaw;

    camera.rotation.x =
        pitch;

}


/* =========================================================
   OBJECTIVE
========================================================= */

function setObjective(
    text
){

    document.getElementById(
        "objective"
    ).textContent =
        text;

}


/* =========================================================
   GAME LOOP
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );


    if(gameStarted){

        movement(dt);

        updateCamera();


        /*
           Full battery lasts
           approximately five minutes
           of continuous use.
        */

        if(
            flashlightOn &&
            battery > 0
        ){

            battery -=
                100 /
                (5*60) *
                dt;


            if(
                battery < 0
            ){

                battery = 0;

            }

        }


        updateFlashlight();

        updatePrompt();

    }


    document.getElementById(
        "batteryText"
    ).textContent =
        Math.ceil(
            battery
        ) + "%";


    document.getElementById(
        "batteryFill"
    ).style.width =
        battery + "%";


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =========================================================
   START BUTTON
========================================================= */

document.getElementById(
    "startButton"
).addEventListener(
    "click",
    () => {

        gameStarted =
            true;

        document.getElementById(
            "startScreen"
        ).style.display =
            "none";

    }
);


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>
