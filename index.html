
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nightfall Diner V2</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080b12;
    font-family: Arial, sans-serif;
    color: white;
}

#hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
}

#crosshair {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 5px;
    height: 5px;
    margin-left: -2.5px;
    margin-top: -2.5px;
    background: white;
    border-radius: 50%;
}

#batteryBox {
    position: absolute;
    right: 20px;
    top: 20px;
    width: 200px;
    padding: 10px;
    background: rgba(0,0,0,.6);
    border-radius: 8px;
}

#batteryBar {
    height: 8px;
    margin-top: 6px;
    background: #333;
    border-radius: 5px;
    overflow: hidden;
}

#batteryFill {
    height: 100%;
    width: 100%;
    background: #dcecff;
}

#inventory {
    position: absolute;
    left: 20px;
    top: 20px;
    padding: 10px 13px;
    background: rgba(0,0,0,.55);
    border-radius: 8px;
}

#objective {
    position: absolute;
    left: 20px;
    bottom: 20px;
    max-width: 380px;
    padding: 12px;
    background: rgba(0,0,0,.55);
    border-radius: 8px;
}

#prompt {
    position: absolute;
    left: 50%;
    bottom: 15%;
    transform: translateX(-50%);
    display: none;
    padding: 10px 16px;
    background: rgba(0,0,0,.8);
    border-radius: 7px;
}

#startScreen {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: radial-gradient(circle, #1b2a3c, #030507 75%);
}

#startBox {
    max-width: 650px;
    padding: 30px;
}

button {
    padding: 14px 25px;
    border: 0;
    border-radius: 7px;
    font-weight: bold;
    cursor: pointer;
}

.small {
    opacity: .7;
    font-size: 13px;
    line-height: 1.6;
}
</style>
</head>

<body>

<div id="startScreen">
    <div id="startBox">
        <h1>NIGHTFALL DINER</h1>
        <p>Something is watching from the forest.</p>

        <p class="small">
            WASD = Move<br>
            Mouse = Look<br>
            E = Collect / Interact<br>
            F = Flashlight
        </p>

        <button id="startButton">ENTER THE FOREST</button>
    </div>
</div>

<div id="hud">

    <div id="inventory">
        Items collected: <span id="items">0</span>
    </div>

    <div id="batteryBox">
        Flashlight: <span id="batteryText">100%</span>

        <div id="batteryBar">
            <div id="batteryFill"></div>
        </div>
    </div>

    <div id="crosshair"></div>

    <div id="prompt"></div>

    <div id="objective">
        Objective: Explore the forest and investigate the diner.
    </div>

</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js";

import { PointerLockControls } from
"https://cdn.jsdelivr.net/npm/three@0.161/examples/jsm/controls/PointerLockControls.js";


/* =========================================================
   BASIC SETUP
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x111a29);

scene.fog = new THREE.FogExp2(
    0x111a29,
    0.017
);


const camera = new THREE.PerspectiveCamera(
    72,
    innerWidth / innerHeight,
    0.05,
    500
);

camera.position.set(0, 1.7, 30);


const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio, 2)
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

document.body.appendChild(
    renderer.domElement
);


const controls =
    new PointerLockControls(
        camera,
        document.body
    );

scene.add(camera);


const clock = new THREE.Clock();


/* =========================================================
   GAME VARIABLES
========================================================= */

const keys = {};

let flashlightOn = true;

let battery = 100;

let collectedItems = 0;

let interactables = [];


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener("keydown", event => {

    keys[event.code] = true;

    if (event.code === "KeyF") {
        flashlightOn = !flashlightOn;
    }

    if (event.code === "KeyE") {
        interact();
    }

});


document.addEventListener("keyup", event => {

    keys[event.code] = false;

});


/* =========================================================
   MATERIAL HELPERS
========================================================= */

function material(color, roughness = 1) {

    return new THREE.MeshStandardMaterial({
        color: color,
        roughness: roughness
    });

}


function box(
    width,
    height,
    depth,
    mat,
    x,
    y,
    z
) {

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),
            mat
        );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    scene.add(mesh);

    return mesh;

}


function cylinder(
    radius,
    height,
    mat,
    x,
    y,
    z
) {

    const mesh =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                radius,
                radius * .88,
                height,
                10
            ),
            mat
        );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    scene.add(mesh);

    return mesh;

}


/* =========================================================
   LIGHTING
========================================================= */

const ambient =
    new THREE.HemisphereLight(
        0x9dbdff,
        0x17110b,
        1.25
    );

scene.add(ambient);


const moon =
    new THREE.DirectionalLight(
        0xbad4ff,
        2.1
    );

moon.position.set(
    -80,
    100,
    40
);

moon.castShadow = true;

moon.shadow.mapSize.set(
    2048,
    2048
);

scene.add(moon);


/* =========================================================
   FLASHLIGHT
========================================================= */

const flashlight =
    new THREE.SpotLight(
        0xeaf4ff,
        90,
        44,
        Math.PI / 7,
        0.55,
        1.4
    );

flashlight.castShadow = true;

flashlight.shadow.mapSize.set(
    1024,
    1024
);

scene.add(flashlight);

scene.add(
    flashlight.target
);


function updateFlashlight() {

    /*
       The flashlight is attached to the camera.

       Therefore:
       Look left  -> flashlight left
       Look right -> flashlight right
       Look up    -> flashlight up
       Look down  -> flashlight down
    */

    const direction =
        new THREE.Vector3(
            0,
            0,
            -1
        ).applyQuaternion(
            camera.quaternion
        );

    flashlight.position.copy(
        camera.position
    );

    flashlight.target.position.copy(
        camera.position
    ).add(
        direction.multiplyScalar(20)
    );

    flashlight.visible =
        flashlightOn &&
        battery > 0;

}


/* =========================================================
   GROUND
========================================================= */

const grassMaterial =
    material(0x263720);

const dirtMaterial =
    material(0x4b3929);


const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            240,
            240
        ),
        grassMaterial
    );

ground.rotation.x =
    -Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);


/* =========================================================
   DIRT ROAD
========================================================= */

box(
    12,
    .04,
    190,
    dirtMaterial,
    0,
    .02,
    -20
);


/* =========================================================
   FOREST
========================================================= */

const barkMaterial =
    material(0x38281e);

const leafMaterial =
    material(0x172a1c);


function createTree(
    x,
    z,
    scale
) {

    cylinder(
        .34 * scale,
        3.4 * scale,
        barkMaterial,
        x,
        1.7 * scale,
        z
    );


    for (
        let layer = 0;
        layer < 4;
        layer++
    ) {

        const crown =
            new THREE.Mesh(
                new THREE.ConeGeometry(
                    (1.8 - layer * .2) * scale,
                    2.1 * scale,
                    8
                ),
                leafMaterial
            );

        crown.position.set(
            x + (Math.random() - .5) * .35 * scale,
            (2.5 + layer * .7) * scale,
            z + (Math.random() - .5) * .35 * scale
        );

        crown.castShadow = true;

        scene.add(crown);

    }

}


/*
   Lots of different tree sizes
   and positions.
*/

for (
    let i = 0;
    i < 100;
    i++
) {

    let x =
        (Math.random() - .5) * 155;

    let z =
        (Math.random() - .5) * 155;


    /*
       Keep the main path clearer.
    */

    if (Math.abs(x) < 10) {

        x +=
            x < 0
            ? -20
            : 20;

    }


    if (
        z > -48 &&
        z < 10 &&
        Math.abs(x) < 25
    ) {

        continue;

    }


    createTree(
        x,
        z,
        .6 + Math.random() * 1.05
    );

}


/* =========================================================
   BUSHES
========================================================= */

for (
    let i = 0;
    i < 70;
    i++
) {

    const x =
        (Math.random() - .5) * 150;

    const z =
        (Math.random() - .5) * 150;


    const bush =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .75 + Math.random() * .5,
                7,
                5
            ),
            material(0x20371f)
        );

    bush.scale.y = .55;

    bush.position.set(
        x,
        .45,
        z
    );

    bush.castShadow = true;

    scene.add(bush);

}


/* =========================================================
   ROCKS
========================================================= */

for (
    let i = 0;
    i < 40;
    i++
) {

    const radius =
        .2 + Math.random() * .55;

    const rock =
        new THREE.Mesh(
            new THREE.DodecahedronGeometry(
                radius,
                0
            ),
            material(0x474840)
        );

    rock.position.set(
        (Math.random() - .5) * 145,
        radius / 2,
        (Math.random() - .5) * 145
    );

    rock.rotation.set(
        Math.random(),
        Math.random(),
        Math.random()
    );

    rock.castShadow = true;

    scene.add(rock);

}


/* =========================================================
   DINER
========================================================= */

const dinerZ = -58;


/* Main building */

box(
    20,
    8,
    16,
    material(0x464540),
    0,
    4,
    dinerZ
);


/* Roof */

box(
    20.5,
    .35,
    16.5,
    material(0x202328),
    0,
    8.15,
    dinerZ
);


/* =========================================================
   DINER WINDOWS
========================================================= */

const glass =
    material(
        0x28444f,
        .25
    );


for (
    const x of [-7, -3, 3, 7]
) {

    box(
        3.2,
        3.1,
        .12,
        glass,
        x,
        4.2,
        dinerZ - 8.05
    );

}


/* =========================================================
   DINER DOOR
========================================================= */

box(
    2.2,
    4.2,
    .15,
    material(0x151719),
    0,
    2.3,
    dinerZ - 8.12
);

box(
    1.7,
    3.7,
    .08,
    glass,
    0,
    2.35,
    dinerZ - 8.2
);


/* =========================================================
   DINER INTERIOR
========================================================= */


/* Counter */

box(
    11,
    1.1,
    2,
    material(0x704b31),
    0,
    1.35,
    dinerZ + 1
);


/* Booths */

for (
    const x of [-6, -2, 2, 6]
) {

    box(
        3.4,
        .25,
        1.5,
        material(0x713f35),
        x,
        1.1,
        dinerZ - 2
    );

    box(
        3.4,
        .25,
        1.5,
        material(0x713f35),
        x,
        1.1,
        dinerZ - 10
    );

}


/* Tables */

for (
    const x of [-6, 0, 6]
) {

    box(
        2.1,
        .2,
        2,
        material(0x63452f),
        x,
        1.25,
        dinerZ + 5
    );

    cylinder(
        .13,
        1.2,
        material(0x29231f),
        x,
        .65,
        dinerZ + 5
    );

}


/* =========================================================
   DINER LIGHTS
========================================================= */

for (
    const x of [-6, 0, 6]
) {

    const light =
        new THREE.PointLight(
            0xffd9a0,
            5,
            13
        );

    light.position.set(
        x,
        7,
        dinerZ
    );

    scene.add(light);

}


/* Exterior neon light */

const neon =
    new THREE.PointLight(
        0xb9d9ff,
        8,
        28
    );

neon.position.set(
    0,
    8.5,
    dinerZ - 9
);

scene.add(neon);


/* =========================================================
   DINER SIGN
========================================================= */

const signCanvas =
    document.createElement(
        "canvas"
    );

signCanvas.width = 1024;
signCanvas.height = 220;

const ctx =
    signCanvas.getContext("2d");

ctx.fillStyle = "#111";
ctx.fillRect(
    0,
    0,
    1024,
    220
);

ctx.font =
    "bold 120px Arial";

ctx.textAlign = "center";
ctx.textBaseline = "middle";

ctx.fillStyle = "#fff";

ctx.fillText(
    "NIGHTFALL DINER",
    512,
    110
);


const signTexture =
    new THREE.CanvasTexture(
        signCanvas
    );


const sign =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            10,
            2.2,
            .3
        ),
        new THREE.MeshStandardMaterial({
            map: signTexture,
            emissive: 0x8899aa,
            emissiveIntensity: 1.5
        })
    );


sign.position.set(
    0,
    10,
    dinerZ - 8.6
);

scene.add(sign);


/* =========================================================
   INTERACTABLE ITEMS
========================================================= */

function registerItem(
    object,
    type,
    name
) {

    object.userData = {
        type: type,
        name: name
    };

    interactables.push(
        object
    );

    scene.add(object);

}


/* =========================================================
   BATTERY
========================================================= */

function createBattery(
    x,
    y,
    z
) {

    const group =
        new THREE.Group();


    const body =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .22,
                .22,
                .72,
                12
            ),
            material(0xd7d7d7)
        );

    body.rotation.z =
        Math.PI / 2;

    group.add(body);


    const cap =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .12,
                .12,
                .1,
                12
            ),
            material(0xc5cbd0)
        );

    cap.rotation.z =
        Math.PI / 2;

    cap.position.x =
        .4;

    group.add(cap);


    group.position.set(
        x,
        y,
        z
    );


    registerItem(
        group,
        "battery",
        "Battery"
    );

}


/* =========================================================
   CHICKEN
========================================================= */

function createChicken(
    x,
    y,
    z
) {

    const group =
        new THREE.Group();


    const meat =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .38,
                10,
                7
            ),
            material(0xb86c3c)
        );

    meat.scale.set(
        1.25,
        .65,
        .75
    );

    group.add(meat);


    const bone =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .08,
                .08,
                .65,
                10
            ),
            material(0xe8d6b5)
        );

    bone.rotation.z =
        Math.PI / 2;

    bone.position.x =
        .42;

    group.add(bone);


    group.position.set(
        x,
        y,
        z
    );


    registerItem(

/* =========================================================
   SPEAKER
========================================================= */

function createSpeaker(
    x,
    y,
    z
) {

    const group =
        new THREE.Group();


    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .9,
                1.2,
                .55
            ),
            material(0x202326)
        );

    group.add(body);


    const grille =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .65,
                .75,

            ),
            material(0x0b0c0d)
        );

    grille.position.z =
        -.3;

    group.add(grille);


    group.position.set(
        x,
        y,
        z
    );


    registerItem(
        group,
        "speaker",
        "Speaker"
    );

}


/* Place items */

createBattery(
    -13,
    1,
    -8
);

createBattery(
    12,
    1,
    -32
);

createBattery(
    -7,
    1,
    -52
);

createBattery(
    6,
    1,
    -72
);


createChicken(
    4,
    1.75,
    -57
);

createChicken(
    -4,
    1.75,
    -55
);


createSpeaker(
    10,
    1.3,
    -55
);


/* =========================================================
   WHITE HUNTER
========================================================= */

const hunter =
    new THREE.Group();


const whiteMaterial =
    material(
        0xf5f5f5,
        .75
    );


/* Body */

const hunterBody =
    new THREE.Mesh(
        new THREE.CapsuleGeometry(
            .55,
            2.5,
            8,
            16
        ),
        whiteMaterial
    );

hunterBody.position.y = 2;

hunter.add(
    hunterBody
);


/* Head */

const hunterHead =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .65,
            16,

        ),

    );

hunterHead.position.y =
    4.05;

hunter.add(
    hunterHead
);

for (
    const side of [-1, 1]
) {

    const arm =
        new THREE.Mesh(
            new THREE.CapsuleGeometry(
                .18,
                2.2,
                6,
                10
            ),
            whiteMaterial
        );

    arm.position.set(
        side * .82,
        2.3,
        0
    );

    hunter.add(arm);


    const leg =
        new THREE.Mesh(
            new THREE.CapsuleGeometry(
                .2,
                2.4,
                6,
                10
            ),
            whiteMaterial
        );

    leg.position.set(
        side * .32,
        .2,
        0
    );

    hunter.add(leg);


    const eye =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .1,
                8,
                8
            ),
            material(0x111111)
        );

    eye.position.set(
        side * .22,
        4.15,
        -.57
    );

    hunter.add(eye);

}


/*
   Put the hunter in the forest.

   White against the dark forest makes
   it clearly visible.
*/

hunter.position.set(
    18,
    0,
    -5
);

scene.add(hunter);


/* =========================================================
   ITEM INTERACTION
========================================================= */

function interact() {

    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        ).applyQuaternion(
            camera.quaternion
        );


    let closest = null;
    let closestDistance = 3.2;


    for (
        const item of interactables
    ) {

        const distance =
            camera.position.distanceTo(
                item.position
            );


        const direction =
            item.position
                .clone()
                .sub(camera.position)
                .normalize();


        if (
            distance < closestDistance &&
            forward.dot(direction) > .45
        ) {

            closest =
                item;

            closestDistance =
                distance;

        }

    }


    if (!closest) {
        return;
    }


    const type =
        closest.userData.type;


    if (
        type === "battery"
    ) {

        battery =
            Math.min(
                100,
                battery + 35
            );

        setObjective(
            "Battery collected. Flashlight charge restored."
        );

    }

    else if (
        type === "chicken"
    ) {

        setObjective(
            "Chicken collected."
        );

    }

    else if (
        type === "speaker"
    ) {

        setObjective(
            "Speaker collected. Something is playing..."
        );

    }


    scene.remove(
        closest
    );


    interactables =
        interactables.filter(
            item =>
                item !== closest
        );


    collectedItems++;


    document.getElementById(
        "items"
    ).textContent =
        collectedItems;

}


/* =========================================================
   INTERACTION PROMPT
========================================================= */

function updatePrompt() {

    const prompt =
        document.getElementById(
            "prompt"
        );

    prompt.style.display =
        "none";


    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        ).applyQuaternion(
            camera.quaternion
        );


    for (
        const item of interactables
    ) {

        const distance =
            camera.position.distanceTo(
                item.position
            );


        const direction =
            item.position
                .clone()
                .sub(camera.position)
                .normalize();


        if (
            distance < 3.2 &&
            forward.dot(direction) > .45
        ) {

            prompt.textContent =
                "[E] PICK UP " +
                item.userData.name
                    .toUpperCase();

            prompt.style.display =
                "block";

            break;

        }

    }

}


/* =========================================================
   OBJECTIVE
========================================================= */

function setObjective(text) {

    document.getElementById(
        "objective"
    ).textContent = text;

}


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function movement(dt) {

    const speed = 6;


    if (keys.KeyW) {

        controls.moveForward(
            speed * dt
        );

    }


    if (keys.KeyS) {

        controls.moveForward(
            -speed * dt
        );

    }


    if (keys.KeyA) {

        controls.moveRight(
            -speed * dt
        );

    }


    if (keys.KeyD) {

        controls.moveRight(
            speed * dt
        );

    }


    camera.position.y =
        1.7;


    camera.position.x =
        Math.max(
            -100,
            Math.min(
                100,
                camera.position.x
            )
        );


    camera.position.z =
        Math.max(
            -100,
            Math.min(
                75,
                camera.position.z
            )
        );

}


/* =========================================================
   MAIN LOOP
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );


    if (
        controls.isLocked
    ) {

        movement(dt);


        /*
           100% -> 0%
           over approximately FIVE MINUTES
           of continuous flashlight use.
        */

        if (
            flashlightOn &&
            battery > 0
        ) {

            battery -=
                100 /
                (5 * 60) *
                dt;


            if (
                battery < 0
            ) {

                battery = 0;

            }

        }


        updateFlashlight();

        updatePrompt();

    }


    document.getElementById(
        "batteryText"
    ).textContent =
        Math.ceil(battery) + "%";


    document.getElementById(
        "batteryFill"
    ).style.width =
        Math.max(
            0,
            battery
        ) + "%";


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =========================================================
   START GAME
========================================================= */

document.getElementById(
    "startButton"
).onclick = () => {

    controls.lock();

};


controls.addEventListener(
    "lock",
    () => {

        document.getElementById(
            "startScreen"
        ).style.display =
            "none";

    }
);


controls.addEventListener(
    "unlock",
    () => {

        document.getElementById(
            "startScreen"
        ).style.display =
            "flex";

    }
);


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>
